# Site settings
title: "feelang"
author: "feelang"
description: "Company of one"
email: feelangcpp@gmail.com
lang: zh-CN
baseurl: ""
url: "https://feelang.github.io"
timezone: Asia/Shanghai
github_username: feelang
location: "Hangzhou"
bio: "Entrepreneur, language enthusiast, and software engineer."
google_analytics: "G-EMB5R38212"
disqus:
  shortname: feelang-github-io

include:
  - _pages

header_pages:
  - _pages/about.md

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
  # Render archived theme source examples as literal Liquid code.
  - scope:
      path: "post-backup/2023-05-27-jekyll-theme-minimal-mistakes.md"
    values:
      render_with_liquid: false
  - scope:
      path: "post-backup/2023-06-07-minimal-mistakes-layouts-source.md"
    values:
      render_with_liquid: false

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
